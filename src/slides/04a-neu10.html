<style>
/* The counter and the wordmark are stacked in one box, so the hand-over at
   the end changes nothing about the layout underneath it. */
#s04a .dcounter-stage {
  position: relative;
  width: 100%;
  min-height: clamp(150px, 26vh, 300px);
}
#s04a .dcounter,
#s04a .dcounter-wordmark {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

/* ---- the ladder, counting itself up ---- */
#s04a .dcounter { gap: clamp(10px, 1.4vw, 24px); }
#s04a .dcounter-numd { display: inline-flex; align-items: baseline; }

#s04a .dcounter-num,
#s04a .dcounter-d {
  font-family: var(--font-display);
  font-size: var(--t-stat);
  font-weight: 600;
  line-height: .9;
  letter-spacing: -.03em;
  color: var(--ink);
  display: inline-block;
}
/* A fixed two-digit box, not a minimum. The numerals sit right-aligned inside
   it and the D butts up against it, so the D holds its ground when the ladder
   crosses 9 into 10 and again when the last rung swaps type for vector. */
#s04a .dcounter-num {
  font-variant-numeric: tabular-nums;
  width: 2ch;
  text-align: right;
}
/* Inline and on the baseline — the same footprint the digits occupied. */
#s04a .dc-ten {
  display: inline-block;
  vertical-align: baseline;
  height: .72em;
  width: auto;
}

#s04a .dcounter-num,
#s04a .dcounter-label {
  transition: transform .09s var(--ease-out), opacity .09s var(--ease-out);
}
#s04a .dcounter-num.is-out   { transform: translateY(-45%); opacity: 0; }
#s04a .dcounter-num.is-in    { transform: translateY(45%);  opacity: 0; }
#s04a .dcounter-label.is-out { transform: translateY(-14%); opacity: 0; }
#s04a .dcounter-label.is-in  { transform: translateY(14%);  opacity: 0; }
#s04a .no-anim { transition: none !important; }

/* ---- the bar ---- */
/* It reads as a separator for the whole climb, then travels the full width of
   "10D" and comes to rest at the left of the numerals — which is exactly the
   space NEU is about to occupy. Its motion is linear, and the D's clip is
   given the matching slice of that same linear travel, so the letter is eaten
   precisely as the bar's edge crosses it. */
#s04a .dcounter-sep {
  flex: none;
  font-size: var(--t-stat);
  width: .07em; height: .64em;
  background: var(--brand-lift);
  border-radius: 1px;
  transition: transform var(--wipe-ms, 520ms) linear, opacity .3s var(--ease);
}
#s04a.is-wiping .dcounter-sep { transform: translateX(var(--sep-x, 0px)); }
#s04a.is-handoff .dcounter-sep { opacity: 0; }

#s04a .dcounter-d {
  clip-path: inset(-40% 0% -40% 0%);
  transition: clip-path var(--d-ms, 120ms) linear var(--d-delay, 0ms);
}
#s04a.is-wiping .dcounter-d { clip-path: inset(-40% 100% -40% 0%); }

/* Live label and sizer share one grid cell, so the column is always as wide
   as the longest rung and the row's width never changes. */
#s04a .dcounter-label {
  display: grid;
  font-family: var(--font-display);
  font-size: var(--t-h2);
  font-weight: 500;
  letter-spacing: -.012em;
  color: var(--ink-2);
  white-space: nowrap;
}
#s04a .dcounter-label > * { grid-area: 1 / 1; text-align: left; }
#s04a .dc-lbl-sizer { visibility: hidden; }
/* Leaves ahead of the bar, on its own longer curve than the roll. */
#s04a.is-label-out .dcounter-label { opacity: 0; transition: opacity .3s var(--ease); }

/* The counter's "10" hands straight over to the wordmark's "10" — same glyph,
   same size, same place — so there is nothing to see in the swap itself. */
#s04a.is-handoff .dcounter-num { opacity: 0; transition: opacity .14s var(--ease); }

/* ---- the name assembling around the 10 ---- */
#s04a .dcounter-wordmark {
  opacity: 0;
  color: var(--ink);
  --brand: var(--brand-lift);
  pointer-events: none;
}
#s04a .dcounter-wordmark svg {
  width: clamp(300px, 52vw, 760px);
  max-width: 100%;
  max-height: 34vh;
  height: auto;
  display: block;
  /* Parked over the counter's "10" until the lockup runs. */
  transform: translate(var(--wm-tx, 0px), var(--wm-ty, 0px)) scale(var(--wm-s, 1));
  transition: transform .76s var(--ease-out);
}
#s04a.is-handoff .dcounter-wordmark { opacity: 1; transition: opacity .14s var(--ease); }
#s04a.is-lockup .dcounter-wordmark svg { transform: none; }

/* NEU builds a letter at a time, left to right, into the space the bar
   opened; the tagline settles in behind the finished name. */
#s04a .wm-neu > *,
#s04a .wm-tag > * {
  opacity: 0;
  transition: opacity .34s var(--ease) calc(var(--i, 0) * 90ms);
}
/* Simple. Smart. Swift. — a word at a time, once the name is standing. */
#s04a .wm-tag > * { transition-delay: calc(.62s + var(--i, 0) * 600ms); }
#s04a.is-lockup .wm-neu > *,
#s04a.is-lockup .wm-tag > * { opacity: 1; }

#s04a .no-anim.dcounter-wordmark svg { transition: none !important; }

@media (max-width: 900px) {
  #s04a .dcounter { gap: clamp(8px, 1.8vw, 16px); }
  #s04a .dcounter-label { font-size: var(--t-h3); }
}
/* Below this the label crowds the numerals on one line; the numerals are the
   point of the slide, so the label is what gives way. */
@media (max-width: 620px) {
  #s04a .dcounter-label,
  #s04a .dcounter-sep { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  #s04a .dcounter,
  #s04a .dcounter-num,
  #s04a .dcounter-d,
  #s04a .dcounter-label,
  #s04a .dcounter-sep,
  #s04a .dcounter-wordmark,
  #s04a .dcounter-wordmark svg,
  #s04a .wm-neu > *,
  #s04a .wm-tag > * { transition-duration: .01ms !important; transition-delay: 0ms !important; }
}
</style>

<script>
Neu10.register('s04a', (function () {
  /* Verbatim from the ladder on screen 5 — same eight rungs, same wording. */
  var LADDER = [
    { n: '3',  label: 'Geometry & Space' },
    { n: '4',  label: 'Time & Phasing' },
    { n: '5',  label: 'Cost & Quantities' },
    { n: '6',  label: 'Sustainability' },
    { n: '7',  label: 'Facility Management' },
    { n: '8',  label: 'Safety & OHS' },
    { n: '9',  label: 'Lean Construction' },
    { n: '10', label: 'Productivity & Integration' }
  ];
  var LAST = LADDER.length - 1;

  /* The wordmark's own "1" and "0". Swapped in as the final rung so that the
     numerals left standing after the wipe are already the brand mark. */
  var TEN_SVG =
    '<svg class="dc-ten" xmlns="http://www.w3.org/2000/svg" viewBox="1188.2 252.3 412.7 334.2">' +
    '<path d="M1264.049 253.654 C1265.429 257.200 1264.678 326.344 1264.678 337.196 L1264.665 571.896 L1213.696 571.911 L1213.696 533.820 L1213.696 353.167 L1188.244 368.213 L1188.269 317.320 L1264.049 253.654Z" fill="currentColor"/>' +
    '<path d="M1445.908 254.221 C1447.024 254.111 1448.147 254.029 1449.270 253.975 C1482.896 252.288 1514.335 263.996 1539.056 286.734 C1575.325 319.610 1590.839 360.171 1594.618 407.837 C1600.893 486.964 1549.033 580.307 1461.704 584.285 C1429.355 586.471 1397.108 574.913 1373.028 553.472 C1336.547 521.494 1320.302 481.542 1315.669 434.359 C1307.887 354.968 1358.220 260.066 1445.908 254.221Z M1451.939 304.793 C1468.274 303.208 1488.093 310.484 1500.803 320.666 C1552.760 362.274 1557.906 450.312 1517.139 501.272 C1501.740 520.526 1485.129 530.637 1460.607 533.476 C1423.343 534.325 1401.150 517.025 1382.325 485.590 C1346.286 425.390 1370.032 310.852 1451.939 304.793Z" fill-rule="evenodd" fill="currentColor"/>' +
    '</svg>';

  var STEP_MS = 1500;  // one rung to the next
  var SWAP_MS = 90;    // the turn of the roll, out then in
  var WIPE_MS = 520;   // the bar's full travel across "10D"

  /* The final rung is held as long as every other rung before the label goes,
     so the climax is not the one the audience gets least time to read. */
  var CLOSE_AT  = LAST * STEP_MS + STEP_MS;
  var WIPE_AT   = CLOSE_AT + 320;
  var HANDOFF_AT = WIPE_AT + WIPE_MS;
  var LOCKUP_AT = HANDOFF_AT + 140;

  var timers = [];

  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function clearAll() {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
  }

  function parts(el) {
    return {
      numd:  el.querySelector('.dcounter-numd'),
      num:   el.querySelector('.dcounter-num'),
      d:     el.querySelector('.dcounter-d'),
      sep:   el.querySelector('.dcounter-sep'),
      label: el.querySelector('.dcounter-label'),
      /* Text goes on the inner span — writing it to the wrapper would take
         the sizer with it and the column would start moving again. */
      lbl:   el.querySelector('.dc-lbl'),
      wm:    el.querySelector('.dcounter-wordmark'),
      svg:   el.querySelector('.dcounter-wordmark svg'),
      ten:   el.querySelector('.wm-ten')
    };
  }

  function paint(p, step) {
    if (step === LAST) {
      p.num.innerHTML = TEN_SVG;
    } else {
      p.num.textContent = LADDER[step].n;
    }
    p.lbl.textContent = LADDER[step].label;
  }

  /* One rung: the standing value rolls up and out, the next is placed below
     it with transitions off, then released so it rolls up into place. The
     forced reflow between the two halves is what stops the browser
     collapsing them into a single no-op — and it is also what hides the
     type-to-vector swap on the last rung. */
  function roll(p, step) {
    p.num.classList.add('is-out');
    p.label.classList.add('is-out');
    at(SWAP_MS, function () {
      paint(p, step);
      p.num.classList.add('no-anim');
      p.label.classList.add('no-anim');
      p.num.classList.remove('is-out');
      p.label.classList.remove('is-out');
      p.num.classList.add('is-in');
      p.label.classList.add('is-in');
      void p.num.offsetWidth;
      p.num.classList.remove('no-anim', 'is-in');
      p.label.classList.remove('no-anim', 'is-in');
    });
  }

  /* The bar crosses the gap, then the D, then the numerals. The D is clipped
     over exactly the slice of that travel in which the bar is on top of it. */
  function armWipe(el, p) {
    var numd = p.numd.getBoundingClientRect();
    var dR   = p.d.getBoundingClientRect();
    var sepR = p.sep.getBoundingClientRect();
    var gap  = Math.max(0, sepR.left - numd.right);
    var total = gap + numd.width;
    el.style.setProperty('--sep-x', (-total) + 'px');
    el.style.setProperty('--wipe-ms', WIPE_MS + 'ms');
    el.style.setProperty('--d-delay', Math.round(WIPE_MS * gap / total) + 'ms');
    el.style.setProperty('--d-ms', Math.round(WIPE_MS * dR.width / total) + 'ms');
  }

  /* Park the wordmark so its own "10" sits exactly on top of the counter's,
     at the same size. The cross-fade between them is then a fade between two
     identical pictures, and the lockup that follows is the "10" carrying the
     rest of the name into place with it. */
  function armLockup(el, p) {
    var svgR = p.svg.getBoundingClientRect();
    var tenR = p.ten.getBoundingClientRect();
    var srcEl = p.num.querySelector('.dc-ten') || p.num;
    var srcR = srcEl.getBoundingClientRect();
    if (!tenR.height || !srcR.height) return;

    var s = srcR.height / tenR.height;
    var cx = svgR.left + svgR.width / 2, cy = svgR.top + svgR.height / 2;
    var tx = (srcR.left + srcR.width / 2) - cx - s * ((tenR.left + tenR.width / 2) - cx);
    var ty = (srcR.top + srcR.height / 2) - cy - s * ((tenR.top + tenR.height / 2) - cy);

    p.wm.classList.add('no-anim');
    el.style.setProperty('--wm-s', s);
    el.style.setProperty('--wm-tx', tx + 'px');
    el.style.setProperty('--wm-ty', ty + 'px');
    /* Reflow on the wrapper, not the <svg>: offsetWidth is an HTMLElement
       property, so reading it off an SVG element is undefined and forces
       nothing — the park would then animate in from identity. */
    void p.wm.offsetWidth;
    p.wm.classList.remove('no-anim');
  }

  function reset(el, p) {
    el.classList.remove('is-label-out', 'is-wiping', 'is-handoff', 'is-lockup');
    p.num.classList.remove('is-out', 'is-in', 'no-anim');
    p.label.classList.remove('is-out', 'is-in', 'no-anim');
    p.wm.classList.remove('no-anim');
    ['--sep-x', '--wipe-ms', '--d-delay', '--d-ms', '--wm-s', '--wm-tx', '--wm-ty']
      .forEach(function (v) { el.style.removeProperty(v); });
    paint(p, 0);
  }

  return {
    enter: function (el) {
      clearAll();
      var p = parts(el);
      reset(el, p);

      /* Nothing here carries meaning the motion alone conveys, so with
         reduced motion the slide simply arrives at its resting state. */
      var still = window.matchMedia &&
                  window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (still) {
        paint(p, LAST);
        armWipe(el, p);
        el.classList.add('is-label-out', 'is-wiping', 'is-handoff', 'is-lockup');
        return;
      }

      for (var s = 1; s <= LAST; s++) {
        (function (step) {
          at(step * STEP_MS, function () { roll(p, step); });
        })(s);
      }

      at(CLOSE_AT, function () { el.classList.add('is-label-out'); });
      /* Measured here, not on entry: the ladder has settled on its final
         value, so the distances the bar travels are the real ones. */
      at(WIPE_AT, function () { armWipe(el, p); el.classList.add('is-wiping'); });
      at(HANDOFF_AT, function () { armLockup(el, p); el.classList.add('is-handoff'); });
      at(LOCKUP_AT, function () { el.classList.add('is-lockup'); });
    },

    /* resetBeats() only knows about [data-beat] and .stagger, so the state
       this slide invents is this slide's to clear — otherwise coming back
       lands on the finished wordmark instead of replaying the climb. */
    leave: function (el) {
      clearAll();
      reset(el, parts(el));
    }
  };
})());
</script>
